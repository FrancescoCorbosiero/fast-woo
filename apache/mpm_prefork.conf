# ============================================
# APACHE MPM PREFORK - parametrizzato da .env
# ============================================
# Sostituisce il default Debian (MaxRequestWorkers 150), che con un limite
# di memoria di 1G porta a processi uccisi dall'OOM killer sotto carico.
# Ogni processo contiene un interprete PHP completo: il numero massimo di
# processi va calcolato sulla memoria del container (vedi README).
# Le variabili arrivano dall'environment del container (docker-compose.yml).
<IfModule mpm_prefork_module>
	StartServers            2
	MinSpareServers         2
	MaxSpareServers         6
	ServerLimit             ${APACHE_MAX_WORKERS}
	MaxRequestWorkers       ${APACHE_MAX_WORKERS}
	MaxConnectionsPerChild  ${APACHE_MAX_CONN_PER_CHILD}
</IfModule>
