# ============================================
# APACHE - hardening per WordPress/WooCommerce
# ============================================
# Non mostrare versione di Apache e sistema operativo negli header/pagine errore
ServerTokens Prod
ServerSignature Off

# Blocca l'esecuzione di PHP nella cartella uploads (opt-in: APACHE_BLOCK_UPLOADS_PHP=true)
# Nessun plugin legittimo dovrebbe eseguire PHP da uploads: e' la classica
# destinazione delle backdoor caricate sfruttando plugin vulnerabili.
<Directory "/var/www/html/wp-content/uploads">
	<FilesMatch "\.(php|phtml|phar)$">
		<If "'${APACHE_BLOCK_UPLOADS_PHP}' == 'true'">
			Require all denied
		</If>
	</FilesMatch>
</Directory>

# Blocca xmlrpc.php (opt-in: APACHE_BLOCK_XMLRPC=true)
# Lasciarlo aperto se usi Jetpack o app che lo richiedono.
<Files "xmlrpc.php">
	<If "'${APACHE_BLOCK_XMLRPC}' == 'true'">
		Require all denied
	</If>
</Files>
