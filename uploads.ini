; PHP Configuration for WordPress
; I valori tra ${...} arrivano dall'environment del container,
; con default definiti in docker-compose.yml (modificabili da .env).

; Upload limits (allineati a caddy.request_body.max_size)
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 100

; Execution limits
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = 600
; Prodotti variabili con molte varianti richiedono valori alti
max_input_vars = ${PHP_MAX_INPUT_VARS}

; Memoria massima per richiesta PHP.
; NOTA: WP_MEMORY_LIMIT / WP_MAX_MEMORY_LIMIT possono solo ALZARE questo valore,
; mai abbassarlo. Per avere frontend leggero e admin generoso, impostare
; PHP_MEMORY_LIMIT basso (es. 256M) e WP_MAX_MEMORY_LIMIT alto (es. 512M).
memory_limit = ${PHP_MEMORY_LIMIT}

; Other useful settings
allow_url_fopen = On
; Non esporre la versione di PHP (header X-Powered-By)
expose_php = Off
