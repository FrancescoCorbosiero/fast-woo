# ============================================
# DOCKER COMPOSE - PRODUCTION
# ============================================
# Architettura:
# - Caddy Docker Proxy ESTERNO (label-based routing, SSL automatico)
# - MariaDB 11.4-lts (LTS fino 2029) con slow query log + tuning
# - WordPress 7-php8.3-apache con Redis object cache
# - Redis 7-alpine per object caching (sessioni, transients, fragments)
# - DB Backup automatici (mysqldump giornalieri, retention configurabile)
# - Log rotation su tutti i container (no disk fill)
# - Resource limits e healthchecks
# - Named volumes con PROJECT_NAME prefix
#
# Tutti i parametri sono in .env (vedi .env.example). Ogni variabile ha un
# default: un .env di una versione precedente continua a funzionare.
# Aggiornamento e dimensionamento: vedi README.md
#
# PREREQUISITO: Caddy Docker Proxy già configurato sul VPS
# Vedi: docs/CADDY_PROXY_SETUP.md
# ============================================

# ============================================
# NETWORKS
# ============================================
# - internal: comunicazione interna tra container
# - caddy: network esterno condiviso con Caddy Docker Proxy
name: ${PROJECT_NAME}
networks:
  internal:
    name: ${PROJECT_NAME}-internal
    driver: bridge
  caddy:
    external: true

# ============================================
# VOLUMES
# ============================================
# Named volumes con prefix per isolamento tra progetti
volumes:
  wordpress-data:
    name: ${PROJECT_NAME}-wordpress-data
  mariadb-data:
    name: ${PROJECT_NAME}-mariadb-data
  redis-data:
    name: ${PROJECT_NAME}-redis-data
  backups-data:
    name: ${PROJECT_NAME}-backups-data

# ============================================
# REUSABLE LOGGING CONFIG
# ============================================
# Anchor YAML: definito una volta, riusato in tutti i servizi
# Previene disk fill da log JSON che crescono all'infinito
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================
  # MARIADB - Database
  # ============================================
  # MariaDB 11.4-lts: Long Term Support fino 2029
  # Ottimizzato per WordPress + WooCommerce
  mariadb:
    image: mariadb:11.4
    container_name: ${PROJECT_NAME}-mariadb
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Esegue mariadb-upgrade automaticamente quando l'immagine 11.4.x
      # viene aggiornata a una patch release successiva
      MARIADB_AUTO_UPGRADE: "1"
    # Parametri ottimizzati per WooCommerce
    # innodb_buffer_pool_size: ~50-60% di MARIADB_MEMORY_LIMIT sotto i 2G, ~70-75% sopra
    # aria/key buffer: WooCommerce usa InnoDB, i default da 128M l'uno erano memoria sprecata
    # slow_query_log: utile per diagnosticare query lente Woo
    command:
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=${MARIADB_BUFFER_POOL:-384M}
      - --innodb_log_file_size=${MARIADB_LOG_FILE_SIZE:-64M}
      # 1 = nessuna transazione persa se il server va giù (più sicuro per gli ordini)
      # 2 = scritture più veloci, si può perdere ~1s di transazioni in caso di crash dell'host
      - --innodb_flush_log_at_trx_commit=${MARIADB_FLUSH_LOG_AT_TRX_COMMIT:-2}
      - --innodb_io_capacity=${MARIADB_IO_CAPACITY:-200}
      - --max_connections=${MARIADB_MAX_CONNECTIONS:-151}
      - --tmp_table_size=${MARIADB_TMP_TABLE_SIZE:-16M}
      - --max_heap_table_size=${MARIADB_TMP_TABLE_SIZE:-16M}
      - --aria_pagecache_buffer_size=${MARIADB_ARIA_PAGECACHE:-32M}
      - --key_buffer_size=${MARIADB_KEY_BUFFER:-16M}
      - --wait_timeout=28800
      - --interactive_timeout=28800
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --slow_query_log=1
      - --slow_query_log_file=/var/lib/mysql/slow.log
      - --long_query_time=${MARIADB_SLOW_QUERY_TIME:-2}
      - --log_queries_not_using_indexes=0
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: ${MARIADB_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${MARIADB_MEMORY_RESERVATION:-256M}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ============================================
  # REDIS - Object Cache
  # ============================================
  # Riduce drasticamente le query al DB per:
  # - WP transients (cache temporanee)
  # - WooCommerce cart fragments (richieste AJAX ogni pageview)
  # - Sessioni utente
  # - Risultati di funzioni costose (es. tax calculation)
  #
  # Setup WordPress:
  # 1. Install "Redis Object Cache" plugin (Till Krüss, gratis)
  # 2. Settings -> Redis -> "Enable Object Cache"
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # maxmemory + LRU eviction: Redis non cresce mai oltre il limite
    # appendonly no: per object cache la persistenza non serve (riempie da DB)
    # REDIS_MEMORY_LIMIT: tenerlo ~1.5x REDIS_MAXMEMORY (frammentazione)
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-160M}
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ============================================
  # WORDPRESS - Applicazione principale
  # ============================================
  # WordPress 7 con PHP 8.3 (supporto di sicurezza fino a fine 2027)
  # Attende che MariaDB E Redis siano healthy prima di avviarsi
  #
  # NOTA: il tag dell'immagine sceglie PHP/Apache. Il core di WordPress vive nel
  # volume e si aggiorna da WordPress: cambiare il tag NON aggiorna un sito esistente.
  wordpress:
    image: wordpress:7-php8.3-apache
    container_name: ${PROJECT_NAME}-wordpress
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wordpress-data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - ./apache/mpm_prefork.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
      - ./apache/zz-fastwoo.conf:/etc/apache2/conf-enabled/zz-fastwoo.conf:ro
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX:-wp_}
      # PHP (letti da uploads.ini / opcache.ini)
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-600}
      PHP_MAX_INPUT_VARS: ${PHP_MAX_INPUT_VARS:-5000}
      PHP_OPCACHE_MEMORY: ${PHP_OPCACHE_MEMORY:-256}
      # Apache (letti da apache/*.conf)
      # APACHE_MAX_WORKERS: processi PHP contemporanei. Vedi README per il calcolo.
      APACHE_MAX_WORKERS: ${APACHE_MAX_WORKERS:-10}
      APACHE_MAX_CONN_PER_CHILD: ${APACHE_MAX_CONN_PER_CHILD:-1000}
      APACHE_BLOCK_UPLOADS_PHP: ${APACHE_BLOCK_UPLOADS_PHP:-false}
      APACHE_BLOCK_XMLRPC: ${APACHE_BLOCK_XMLRPC:-false}
      # Configurazione extra wp-config.php
      # Il wp-config.php generato dall'immagine legge questo blocco a OGNI richiesta:
      # dopo una modifica al .env basta `docker compose up -d`.
      # (Vale finché wp-config.php è quello generato dall'immagine, verificabile con:
      #  docker compose exec wordpress grep -c getenv_docker wp-config.php  -> deve essere > 0)
      # defined() || define(): nessun warning se la costante è già definita altrove.
      # Valori booleani in .env: solo true/false.
      WORDPRESS_CONFIG_EXTRA: |
        defined('WP_MEMORY_LIMIT') || define('WP_MEMORY_LIMIT', '${WP_MEMORY_LIMIT:-256M}');
        defined('WP_MAX_MEMORY_LIMIT') || define('WP_MAX_MEMORY_LIMIT', '${WP_MAX_MEMORY_LIMIT:-384M}');
        defined('FS_METHOD') || define('FS_METHOD', 'direct');
        defined('DISALLOW_FILE_EDIT') || define('DISALLOW_FILE_EDIT', ${DISALLOW_FILE_EDIT:-false});
        defined('DISABLE_WP_CRON') || define('DISABLE_WP_CRON', ${DISABLE_WP_CRON:-false});
        defined('WP_REDIS_HOST') || define('WP_REDIS_HOST', 'redis');
        defined('WP_REDIS_PORT') || define('WP_REDIS_PORT', 6379);
        defined('WP_REDIS_TIMEOUT') || define('WP_REDIS_TIMEOUT', 1);
        defined('WP_REDIS_READ_TIMEOUT') || define('WP_REDIS_READ_TIMEOUT', 1);
        defined('WP_REDIS_DATABASE') || define('WP_REDIS_DATABASE', 0);
        defined('WP_CACHE_KEY_SALT') || define('WP_CACHE_KEY_SALT', '${DOMAIN}_');
        defined('WP_CACHE') || define('WP_CACHE', true);
    networks:
      - internal
      - caddy
    deploy:
      resources:
        limits:
          memory: ${WP_MEMORY_LIMIT_CONTAINER:-1G}
        reservations:
          memory: ${WP_MEMORY_RESERVATION:-512M}
    # Verifica che Apache risponda (un file statico: non dipende da plugin
    # che nascondono wp-login.php o da modalità manutenzione)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "10", "http://127.0.0.1/wp-includes/images/blank.gif"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    # Labels per Caddy Docker Proxy (SSL automatico)
    labels:
      caddy: ${DOMAIN}, www.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.encode: zstd gzip
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.X-Frame-Options: SAMEORIGIN
      caddy.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy.request_body.max_size: 512MB
    logging: *default-logging

  # ============================================
  # DB BACKUP - mysqldump automatici
  # ============================================
  # tiredofit/db-backup v4.1.100 (pinnato per digest)
  # - Backup giornalieri compressi (gzip) in /backup
  # - Retention configurabile (default 14 giorni)
  # - Il volume dei backup va incluso nel backup della VPS: il dump deve
  #   girare PRIMA della finestra di backup della VPS (BACKUP_SCHEDULE + BACKUP_TIMEZONE)
  #
  # NOTA: l'immagine è fuori manutenzione dal 12/03/2026 (successore: nfrastack/db-backup).
  # Il digest pinnato funziona; NON usare il tag :latest, che oggi non esegue backup.
  #
  # BACKUP MANUALE:
  #   docker compose exec db-backup backup01-now
  #
  # ELENCO BACKUP:
  #   docker compose exec db-backup ls -la /backup
  #
  # RIPRISTINO (dalla cartella del progetto):
  #   docker compose cp db-backup:/backup/<file>.sql.gz .
  #   gunzip -c <file>.sql.gz | docker compose exec -T mariadb sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" "$MARIADB_DATABASE"'
  db-backup:
    image: tiredofit/db-backup@sha256:761d8613c2c5921ea71f91408eadfe2ad43294c0731abc5b5e0cfc241696e08a
    container_name: ${PROJECT_NAME}-db-backup
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - backups-data:/backup
    environment:
      # Fuso orario della schedulazione (default UTC, come nelle versioni precedenti)
      TIMEZONE: ${BACKUP_TIMEZONE:-Etc/GMT}
      # Database
      DB01_TYPE: mariadb
      DB01_HOST: mariadb
      DB01_PORT: 3306
      DB01_NAME: ${DB_NAME}
      DB01_USER: root
      DB01_PASS: ${DB_ROOT_PASSWORD}
      # Schedulazione: ogni notte alle 03:00 (nel fuso BACKUP_TIMEZONE)
      # Sintassi cron a 5 campi: min ora giorno mese giorno_settimana
      DEFAULT_BACKUP_BEGIN: ${BACKUP_SCHEDULE:-0 3 * * *}
      # Per quanti minuti tenere i dump
      DEFAULT_CLEANUP_TIME: ${BACKUP_RETENTION_MINUTES:-20160}  # 14 giorni = 60*24*14
      # Compressione
      DEFAULT_COMPRESSION: GZ
      DEFAULT_COMPRESSION_LEVEL: 6
      # Container metadata per logging
      CONTAINER_ENABLE_MONITORING: "FALSE"
      CONTAINER_LOG_LEVEL: NOTICE
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging: *default-logging

  # ============================================
  # PHPMYADMIN - Database GUI (OPZIONALE)
  # ============================================
  # Attivo SOLO con: docker compose --profile debug up -d
  # Accessibile SOLO via SSH tunnel (127.0.0.1:8081)
  # NON esposto su internet per sicurezza
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${PROJECT_NAME}-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 512M
    networks:
      - internal
    # IMPORTANTE: Solo localhost (richiede SSH tunnel)
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    profiles:
      - debug
    logging: *default-logging
