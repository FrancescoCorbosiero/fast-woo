# ============================================
# DOCKER COMPOSE - PRODUCTION
# ============================================
# Architettura:
# - Caddy Docker Proxy ESTERNO (label-based routing, SSL automatico)
# - MariaDB 11.4-lts (LTS fino 2029) con slow query log + tuning
# - WordPress 6-php8.3-apache con Redis object cache
# - Redis 7-alpine per object caching (sessioni, transients, fragments)
# - DB Backup automatici (mysqldump giornalieri, retention configurabile)
# - Log rotation su tutti i container (no disk fill)
# - Resource limits e healthchecks
# - Named volumes con PROJECT_NAME prefix
#
# PREREQUISITO: Caddy Docker Proxy già configurato sul VPS
# Vedi: docs/CADDY_PROXY_SETUP.md
# ============================================

# ============================================
# NETWORKS
# ============================================
# - internal: comunicazione interna tra container
# - caddy: network esterno condiviso con Caddy Docker Proxy
name: ${PROJECT_NAME}
networks:
  internal:
    name: ${PROJECT_NAME}-internal
    driver: bridge
  caddy:
    external: true

# ============================================
# VOLUMES
# ============================================
# Named volumes con prefix per isolamento tra progetti
volumes:
  wordpress-data:
    name: ${PROJECT_NAME}-wordpress-data
  mariadb-data:
    name: ${PROJECT_NAME}-mariadb-data
  redis-data:
    name: ${PROJECT_NAME}-redis-data
  backups-data:
    name: ${PROJECT_NAME}-backups-data

# ============================================
# REUSABLE LOGGING CONFIG
# ============================================
# Anchor YAML: definito una volta, riusato in tutti i servizi
# Previene disk fill da log JSON che crescono all'infinito
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================
  # MARIADB - Database
  # ============================================
  # MariaDB 11.4-lts: Long Term Support fino 2029
  # Ottimizzato per WordPress + WooCommerce
  mariadb:
    image: mariadb:11.4
    container_name: ${PROJECT_NAME}-mariadb
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # Parametri ottimizzati per WooCommerce
    # innodb_buffer_pool_size: 60-70% della RAM dedicata a MariaDB
    # slow_query_log: utile per diagnosticare query lente Woo
    command:
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=${MARIADB_BUFFER_POOL:-384M}
      - --innodb_log_file_size=64M
      - --innodb_flush_log_at_trx_commit=2
      - --wait_timeout=28800
      - --interactive_timeout=28800
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --slow_query_log=1
      - --slow_query_log_file=/var/lib/mysql/slow.log
      - --long_query_time=${MARIADB_SLOW_QUERY_TIME:-2}
      - --log_queries_not_using_indexes=0
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: ${MARIADB_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${MARIADB_MEMORY_RESERVATION:-256M}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ============================================
  # REDIS - Object Cache
  # ============================================
  # Riduce drasticamente le query al DB per:
  # - WP transients (cache temporanee)
  # - WooCommerce cart fragments (richieste AJAX ogni pageview)
  # - Sessioni utente
  # - Risultati di funzioni costose (es. tax calculation)
  #
  # Setup WordPress:
  # 1. Install "Redis Object Cache" plugin (Till Krüss, gratis)
  # 2. Settings -> Redis -> "Enable Object Cache"
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # maxmemory + LRU eviction: Redis non cresce mai oltre il limite
    # appendonly no: per object cache la persistenza non serve (riempie da DB)
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-160M}
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ============================================
  # WORDPRESS - Applicazione principale
  # ============================================
  # WordPress 6 con PHP 8.3 (supporto fino 2027)
  # Attende che MariaDB E Redis siano healthy prima di avviarsi
  wordpress:
    image: wordpress:7-php8.3-apache
    container_name: ${PROJECT_NAME}-wordpress
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wordpress-data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX:-wp_}
      # Configurazione extra wp-config.php
      # NOTA: questo blocco viene scritto in wp-config.php SOLO al primo boot.
      # Se modifichi qui dopo, devi anche editare wp-config.php manualmente
      # o eliminarlo (i dati DB restano) e far rigenerare il file.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '${WP_MEMORY_LIMIT:-256M}');
        define('WP_MAX_MEMORY_LIMIT', '${WP_MAX_MEMORY_LIMIT:-384M}');
        define('FS_METHOD', 'direct');
        define('DISALLOW_FILE_EDIT', ${DISALLOW_FILE_EDIT:-false});
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_TIMEOUT', 1);
        define('WP_REDIS_READ_TIMEOUT', 1);
        define('WP_REDIS_DATABASE', 0);
        define('WP_CACHE_KEY_SALT', '${DOMAIN}_');
        define('WP_CACHE', true);
    networks:
      - internal
      - caddy
    deploy:
      resources:
        limits:
          memory: ${WP_MEMORY_LIMIT_CONTAINER:-1G}
        reservations:
          memory: ${WP_MEMORY_RESERVATION:-512M}
    # Labels per Caddy Docker Proxy (SSL automatico)
    labels:
      caddy: ${DOMAIN}, www.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.encode: zstd gzip
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.X-Frame-Options: SAMEORIGIN
      caddy.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy.request_body.max_size: 512MB
    logging: *default-logging

  # ============================================
  # DB BACKUP - mysqldump automatici
  # ============================================
  # tiredofit/db-backup: container leggero che esegue mysqldump schedulati
  # - Backup giornalieri compressi (gzip) in /backups
  # - Retention configurabile (default 14 giorni)
  # - Compatibile con MariaDB/MySQL
  #
  # RIPRISTINO MANUALE:
  #   docker compose exec mariadb sh -c 'mariadb -u root -p${DB_ROOT_PASSWORD} ${DB_NAME}' < backup.sql
  #
  # ACCESSO BACKUP:
  #   docker run --rm -v ${PROJECT_NAME}-backups-data:/data alpine ls /data
  #   docker cp ${PROJECT_NAME}-db-backup:/backups ./local-backups
  db-backup:
    image: tiredofit/db-backup@sha256:761d8613c2c5921ea71f91408eadfe2ad43294c0731abc5b5e0cfc241696e08a
    container_name: ${PROJECT_NAME}-db-backup
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - backups-data:/backup
    environment:
      # Tipo DB
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASSWORD}
      # Schedulazione: ogni notte alle 03:00
      # Sintassi cron a 5 campi: min ora giorno mese giorno_settimana
      DB_DUMP_BEGIN: ${BACKUP_SCHEDULE:-0 3 * * *}
      # Quanti giorni tenere i dump
      DB_CLEANUP_TIME: ${BACKUP_RETENTION_MINUTES:-20160}  # 14 giorni = 60*24*14
      # Compressione
      COMPRESSION: GZ
      COMPRESSION_LEVEL: 6
      # Container metadata per logging
      CONTAINER_ENABLE_MONITORING: "FALSE"
      CONTAINER_LOG_LEVEL: NOTICE
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging: *default-logging

  # ============================================
  # PHPMYADMIN - Database GUI (OPZIONALE)
  # ============================================
  # Attivo SOLO con: docker compose --profile debug up -d
  # Accessibile SOLO via SSH tunnel (127.0.0.1:8081)
  # NON esposto su internet per sicurezza
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${PROJECT_NAME}-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 512M
    networks:
      - internal
    # IMPORTANTE: Solo localhost (richiede SSH tunnel)
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    profiles:
      - debug
    logging: *default-logging